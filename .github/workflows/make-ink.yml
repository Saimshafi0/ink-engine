name: make-ink
run-name: ink ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      kind:    { description: "video or qshorts", required: true, default: "video" }
      script:  { description: "script path in repo", required: true }
      preview: { description: "yes = 60 sec test", required: false, default: "no" }
      mode:    { description: "A = drawn, B = AI scenes", required: false, default: "A" }
      tag:     { description: "id used by the app", required: false, default: "manual" }

permissions:
  contents: read
  actions: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Get the engine
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore voice model
        id: models
        uses: actions/cache/restore@v4
        with:
          path: models
          key: ink-models-v1

      - name: Restore saved voice + AI pictures
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ink-cache-${{ github.run_id }}
          restore-keys: ink-cache-

      - name: Install tools
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          pip install -q -r requirements.txt

      - name: Download voice model (first time only)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL --retry 4 -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          curl -sSfL --retry 4 -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - name: Save voice model
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models
          key: ink-models-v1

      - name: Make the video (voice, pictures, music, captions, Shorts)
        env:
          KIND: ${{ inputs.kind }}
          SCRIPT: ${{ inputs.script }}
          PREVIEW: ${{ inputs.preview }}
          MODE: ${{ inputs.mode }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          case "$KIND" in video|qshorts) ;; *) echo "bad kind"; exit 1;; esac
          case "$MODE" in A|B) ;; *) MODE=A;; esac
          ARGS=""
          if [ "$PREVIEW" = "yes" ]; then ARGS="--preview"; fi
          python make.py "$KIND" "$SCRIPT" --mode "$MODE" --out result $ARGS

      - name: Save voice + AI pictures for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ink-cache-${{ github.run_id }}

      - name: Clean up big temporary files
        if: always()
        run: |
          find output -name "*.wav" -delete 2>/dev/null || true
          rm -rf output/result/_work 2>/dev/null || true

      - name: Upload the finished video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: output/result
          retention-days: 3
          if-no-files-found: warn
